<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>AcademiaPro — Redirecionando...</title>
  <script>
    // Single Page Application (SPA) fallback para GitHub Pages
    (function () {
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase + '/');
    })();
  </script>
</head>
<body style="background:#0A0A0A;color:#EDEDED;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  Redirecionando para AcademiaPro...
</body>
</html>
